[package]
name = "nasa-ads"
version = "0.1.0"
edition = "2021"
authors = ["Andy Casey <acasey@flatironinstitute.org>"]
description = "Interactive command-line tool for querying NASA/ADS (Astrophysics Data System) API"
homepage = "https://github.com/andycasey/ads"
repository = "https://github.com/andycasey/ads"
license = "MIT"
keywords = ["astronomy", "astrophysics", "research", "nasa", "ads" "papers", "cli"]
categories = ["command-line-utilities", "science"]
readme = "README.md"

[[bin]]
name = "ads"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
dialoguer = "0.11"
arboard = "3.4"
webbrowser = "1.0"
console = "0.15"
textwrap = "0.16"
